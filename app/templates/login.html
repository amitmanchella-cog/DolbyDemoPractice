{% extends "base.html" %}
{% block title %}Sign in · {{ app_title }}{% endblock %}
{% block content %}
<section class="card auth-card">
  <h1>Sign in</h1>
  <p class="lead">Admins only. Enter your credentials to continue.</p>
  {% if error %}
  <p class="alert alert-error" role="alert" id="login-error">{{ error }}</p>
  {% endif %}
  <form method="post" action="/login" class="form" id="login-form">
    <label for="username">Username</label>
    <input id="username" name="username" type="text" autocomplete="username"
           value="{{ username or '' }}" required autofocus>
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>
    <button type="submit" class="btn btn-primary" id="sign-in">Sign in</button>
  </form>
</section>
{% endblock %}
